<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ranchborn — Breeding Prototype</title>
    <link rel="icon" href="data:," />
    <style>
      /* Warm, rustic, painted-wood palette, following the art direction in §30.1. */
      :root {
        --paper: #f6efe2;
        --paper-deep: #ece0cc;
        --ink: #3b3128;
        --ink-soft: #6d5f50;
        --line: #d8c8ac;
        --barn: #b4543a;
        --barn-dark: #8f3f2b;
        --meadow: #6f8f52;
        --sky: #6f93a8;
        --gold: #d9a441;
        --shadow: 0 2px 0 rgba(90, 70, 45, 0.18);
        --radius: 14px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.5 ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      h1, h2, h3, h4 { margin: 0 0 0.4em; line-height: 1.2; }
      h1 { font-size: 1.4rem; letter-spacing: 0.01em; }
      h2 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
      h3 { font-size: 1rem; }
      h4 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }

      button, select {
        font: inherit;
        color: var(--ink);
        background: var(--paper-deep);
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
        box-shadow: var(--shadow);
      }
      button:hover, select:hover { background: #fff8ea; }
      button.primary {
        background: var(--barn);
        border-color: var(--barn-dark);
        color: #fff6ec;
        font-weight: 600;
        width: 100%;
        padding: 10px;
        margin-top: 10px;
      }
      button.primary:hover { background: var(--barn-dark); }

      /* ---- Top bar ---- */
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        background: var(--paper-deep);
        border-bottom: 3px solid var(--line);
      }
      .brand { display: flex; align-items: baseline; gap: 10px; }
      .brand span { color: var(--ink-soft); font-size: 0.85rem; }
      .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .controls label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--ink-soft); }
      .day {
        background: var(--meadow);
        color: #fff;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .toggle { cursor: pointer; }

      /* ---- Layout ---- */
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 18px;
        padding: 18px;
        align-items: start;
      }
      @media (max-width: 980px) {
        main { grid-template-columns: minmax(0, 1fr); }
      }

      /* Orientation for a cold open: this page has to explain itself. */
      .guide {
        position: relative;
        background: #fffaf0;
        border: 2px solid var(--line);
        border-left: 6px solid var(--meadow);
        border-radius: var(--radius);
        padding: 14px 44px 14px 16px;
        margin-bottom: 18px;
        box-shadow: var(--shadow);
      }
      .guide h2 { margin-bottom: 6px; }
      .guide p { margin: 0 0 8px; font-size: 0.88rem; max-width: 68ch; }
      .guide ol { margin: 0; padding-left: 20px; font-size: 0.88rem; max-width: 68ch; }
      .guide li { margin-bottom: 4px; }
      .guide li::marker { color: var(--meadow); font-weight: 700; }
      .dismiss {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 28px;
        height: 28px;
        padding: 0;
        line-height: 1;
        font-size: 1.1rem;
        border-radius: 8px;
        color: var(--ink-soft);
      }

      .count { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--ink-soft); }
      .hint { color: var(--ink-soft); font-size: 0.85rem; margin: 4px 0 10px; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.78rem; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 14px;
      }

      /* ---- Monster cards ---- */
      .card {
        position: relative;
        background: #fffaf0;
        border: 2px solid var(--line);
        border-radius: var(--radius);
        padding: 10px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: transform 0.12s ease, border-color 0.12s ease;
      }
      .card:hover { transform: translateY(-2px); }
      .card:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
      .card.is-parent-a { border-color: var(--barn); background: #fff3ea; }
      .card.is-parent-b { border-color: var(--sky); background: #eef5f8; }
      .card.compact { padding: 6px; }
      .card.compact h3 { font-size: 0.85rem; }

      .portrait {
        display: flex;
        justify-content: center;
        background: linear-gradient(180deg, #eaf1dc 0%, #dce7c8 100%);
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 8px;
      }
      .portrait svg { max-width: 100%; height: auto; }

      .stage { margin: 0 0 6px; font-size: 0.78rem; color: var(--ink-soft); }
      .mutation { color: var(--barn); font-weight: 700; }

      .traits { list-style: none; margin: 0 0 6px; padding: 0; font-size: 0.78rem; }
      .traits li { color: var(--ink-soft); }
      .tags { margin: 0; font-size: 0.75rem; color: var(--meadow); font-weight: 600; }

      .pick, .role {
        position: absolute;
        top: 8px;
        right: 8px;
        font-size: 0.68rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        color: #fff;
        z-index: 1;
      }
      .pick-a { background: var(--barn); }
      .pick-b { background: var(--sky); }
      .role { background: var(--ink-soft); }

      /* ---- Panel ---- */
      .panel { display: flex; flex-direction: column; gap: 16px; }
      .panel > section {
        background: #fffaf0;
        border: 2px solid var(--line);
        border-radius: var(--radius);
        padding: 14px;
        box-shadow: var(--shadow);
      }

      .forecast-head { display: flex; justify-content: space-between; align-items: baseline; }
      .compat { font-size: 0.78rem; color: var(--meadow); font-weight: 700; }

      .forecast-slot { margin-bottom: 10px; }
      .slot-name { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
      .bar-row { display: grid; grid-template-columns: 96px 1fr 38px; gap: 6px; align-items: center; margin-top: 3px; }
      .bar-label { font-size: 0.76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar-track { background: var(--paper-deep); border-radius: 999px; height: 9px; overflow: hidden; }
      .bar-fill { display: block; height: 100%; background: var(--meadow); border-radius: 999px; }
      .bar-row.is-mutation .bar-fill { background: var(--gold); }
      .bar-row.is-mutation .bar-label::after { content: " ✦"; color: var(--gold); }
      .bar-value { font-size: 0.74rem; text-align: right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

      .carried { font-size: 0.78rem; color: var(--gold); font-weight: 600; margin: 6px 0 0; }
      .tendency { font-size: 0.78rem; color: var(--ink-soft); margin: 4px 0 0; }

      .blocked ul { margin: 4px 0; padding-left: 18px; font-size: 0.82rem; color: var(--barn); }

      /* ---- Lineage ---- */
      .callout {
        background: #fdf3d8;
        border: 2px solid var(--gold);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.82rem;
        margin-bottom: 12px;
      }
      .tree { display: flex; flex-direction: column; gap: 10px; }
      .tier .row { display: flex; flex-wrap: wrap; gap: 8px; }
      .tier .row .card { flex: 0 1 130px; }

      /* ---- Advanced ---- */
      .advanced { margin-top: 14px; border-top: 2px dashed var(--line); padding-top: 12px; }
      .advanced table { width: 100%; border-collapse: collapse; font-size: 0.74rem; }
      .advanced th { text-align: left; color: var(--ink-soft); font-weight: 600; padding: 3px 4px; }
      .advanced td { padding: 3px 4px; border-top: 1px solid var(--line); }
      .advanced tr.has-carrier { background: #fdf6e4; }
      .carrier { color: var(--gold); font-weight: 600; }
      .stats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; font-size: 0.78rem; }
      .stats li { display: flex; justify-content: space-between; gap: 6px; }
      .stats span { color: var(--ink-soft); text-transform: capitalize; }
      .quirks { margin: 0; padding-left: 18px; font-size: 0.78rem; color: var(--ink-soft); }

      /* ---- Species and breed identity ---- */
      .species-tag {
        display: inline-block;
        background: var(--meadow);
        color: #fff;
        border-radius: 999px;
        padding: 1px 7px;
        font-size: 0.68rem;
        font-weight: 700;
        margin-right: 3px;
      }
      .crest {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        background: var(--gold);
        color: #fff;
        border-radius: 999px;
        font-size: 0.9rem;
        z-index: 1;
        box-shadow: var(--shadow);
      }
      .rescue { display: inline-flex; gap: 4px; align-items: center; font-size: 0.85rem; color: var(--ink-soft); }
      .rescue button { padding: 5px 9px; font-size: 0.8rem; }

      /* ---- Registry ---- */
      .registry h4, .breed-card h4 { margin: 12px 0 5px; }
      .hallmarks { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 0.8rem; }
      .hallmarks li { display: flex; justify-content: space-between; gap: 8px; }
      .hallmarks li span { color: var(--ink-soft); }
      .standard-line { margin: 0; font-size: 0.82rem; color: var(--meadow); font-weight: 600; }

      .requirements { list-style: none; margin: 0; padding: 0; font-size: 0.8rem; }
      .requirements li {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        gap: 6px;
        align-items: baseline;
        padding: 3px 0;
        border-bottom: 1px solid var(--line);
      }
      .requirements .tick { font-weight: 700; }
      .requirements .met .tick { color: var(--meadow); }
      .requirements .unmet .tick { color: var(--ink-soft); }
      .requirements .unmet .req-label { color: var(--ink-soft); }
      .requirements .req-detail { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 0.76rem; }

      .register-form { display: grid; gap: 6px; margin-top: 12px; }
      .register-form input {
        font: inherit;
        padding: 8px 10px;
        border: 2px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        color: var(--ink);
      }
      .register-form input:disabled { opacity: 0.55; }
      .register-form button:disabled { opacity: 0.5; cursor: not-allowed; }
      .register-form button.primary { margin-top: 0; }

      .breed-card { background: #fdf6e4; border: 2px solid var(--gold); border-radius: var(--radius); padding: 12px; }
      .breed-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      .breed-head h3 { margin: 0; }
      .breed-crest {
        width: 40px; height: 40px; display: grid; place-items: center;
        background: var(--gold); color: #fff; border-radius: 12px; font-size: 1.3rem;
      }
      .rank { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
      .rank-emerging { color: var(--ink-soft); }
      .rank-recognized { color: var(--meadow); }
      .rank-heritage { color: var(--barn); }

      .log ul { list-style: none; margin: 0; padding: 0; font-size: 0.78rem; color: var(--ink-soft); }
      .log li { padding: 3px 0; border-bottom: 1px solid var(--line); }

      @media (prefers-reduced-motion: reduce) {
        .card { transition: none; }
        .card:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/dist/prototype/src/app.js"></script>
  </body>
</html>
